<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Inverse kinematics method families</title><desc id="d">A visual map of analytical, Jacobian-based, and optimization-based inverse kinematics methods.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101a31"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs>
<rect width="1400" height="760" rx="42" fill="url(#bg)"/>
<text x="70" y="78" fill="#fff" font-family="Inter,Arial" font-size="38" font-weight="800">Three families, one question</text><text x="70" y="118" fill="#a8b5c8" font-family="Inter,Arial" font-size="21">Choose the representation that makes your constraints, singularities, and initialization visible.</text>
<g transform="translate(70 180)"><rect width="390" height="480" rx="30" fill="#0b2030" stroke="#22d3ee" stroke-width="2"/><circle cx="58" cy="58" r="26" fill="#22d3ee" opacity=".18"/><text x="58" y="67" text-anchor="middle" fill="#67e8f9" font-family="Inter,Arial" font-size="25" font-weight="900">1</text><text x="105" y="65" fill="#fff" font-family="Inter,Arial" font-size="29" font-weight="800">Analytical / geometric</text><text x="32" y="126" fill="#dbeafe" font-family="Inter,Arial" font-size="22" font-weight="700">Solve the geometry directly</text><text x="32" y="170" fill="#a8b5c8" font-family="Inter,Arial" font-size="18"><tspan x="32" dy="0">• closed-form branches when structure permits</tspan><tspan x="32" dy="34">• fast and interpretable</tspan><tspan x="32" dy="34">• robot-specific derivation</tspan><tspan x="32" dy="34">• difficult for complex chains and constraints</tspan></text><rect x="32" y="330" width="326" height="100" rx="18" fill="#061522" stroke="#22d3ee" stroke-opacity=".35"/><text x="195" y="370" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="21">f(q) = x<tspan baseline-shift="sub">g</tspan></text><text x="195" y="405" text-anchor="middle" fill="#a8b5c8" font-family="Inter,Arial" font-size="17">enumerate explicit solutions</text></g>
<g transform="translate(505 180)"><rect width="390" height="480" rx="30" fill="#17172b" stroke="#a78bfa" stroke-width="2"/><circle cx="58" cy="58" r="26" fill="#a78bfa" opacity=".18"/><text x="58" y="67" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial" font-size="25" font-weight="900">2</text><text x="105" y="65" fill="#fff" font-family="Inter,Arial" font-size="29" font-weight="800">Jacobian-based</text><text x="32" y="126" fill="#dbeafe" font-family="Inter,Arial" font-size="22" font-weight="700">Move locally in task space</text><text x="32" y="170" fill="#a8b5c8" font-family="Inter,Arial" font-size="18"><tspan x="32" dy="0">• Jacobian transpose</tspan><tspan x="32" dy="34">• pseudoinverse and null-space motion</tspan><tspan x="32" dy="34">• damped least squares near singularities</tspan><tspan x="32" dy="34">• local: the seed determines the basin</tspan></text><rect x="32" y="330" width="326" height="100" rx="18" fill="#0d1021" stroke="#a78bfa" stroke-opacity=".35"/><text x="195" y="370" text-anchor="middle" fill="#c4b5fd" font-family="monospace" font-size="21">Δq = J<tspan baseline-shift="super">†</tspan> e</text><text x="195" y="405" text-anchor="middle" fill="#a8b5c8" font-family="Inter,Arial" font-size="17">iterate a local linear model</text></g>
<g transform="translate(940 180)"><rect width="390" height="480" rx="30" fill="#10251f" stroke="#34d399" stroke-width="2"/><circle cx="58" cy="58" r="26" fill="#34d399" opacity=".18"/><text x="58" y="67" text-anchor="middle" fill="#6ee7b7" font-family="Inter,Arial" font-size="25" font-weight="900">3</text><text x="105" y="65" fill="#fff" font-family="Inter,Arial" font-size="29" font-weight="800">Optimization / QP</text><text x="32" y="126" fill="#dbeafe" font-family="Inter,Arial" font-size="22" font-weight="700">Make objectives and limits explicit</text><text x="32" y="170" fill="#a8b5c8" font-family="Inter,Arial" font-size="18"><tspan x="32" dy="0">• joint and step bounds</tspan><tspan x="32" dy="34">• posture, task weights, priorities</tspan><tspan x="32" dy="34">• linearized collision or velocity constraints</tspan><tspan x="32" dy="34">• still local when built around the current q</tspan></text><rect x="32" y="330" width="326" height="100" rx="18" fill="#071a16" stroke="#34d399" stroke-opacity=".35"/><text x="195" y="366" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="18">min ½‖JΔq − e‖²</text><text x="195" y="401" text-anchor="middle" fill="#a8b5c8" font-family="Inter,Arial" font-size="17">subject to bounds</text></g>
<path d="M330 700H1070" stroke="url(#a)" stroke-width="5" stroke-linecap="round"/><text x="700" y="730" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial" font-size="18">In practice, robust systems combine families rather than treating one method as universal.</text>
</svg>