<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Elbow-up and elbow-down analytical inverse-kinematics branches</title><desc id="d">A planar two-link arm reaches the same target with two different joint configurations.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101a31"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="520" rx="38" fill="url(#bg)"/><text x="60" y="68" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="800">One target, two analytical branches</text><text x="60" y="105" fill="#a8b5c8" font-family="Inter,Arial" font-size="19">Closed-form geometry can enumerate solutions rather than discovering them from an initial guess.</text><g transform="translate(70 145)"><rect width="500" height="300" rx="25" fill="#071426" stroke="#22d3ee"/><path d="M85 235H430M85 235V45" stroke="#334155" stroke-width="2"/><circle cx="405" cy="105" r="15" fill="#fbbf24" filter="url(#glow)"/><g fill="none" stroke-linecap="round" stroke-width="15"><path d="M115 235L250 90L405 105" stroke="#67e8f9"/></g><g fill="#fff"><circle cx="115" cy="235" r="12"/><circle cx="250" cy="90" r="12"/></g><text x="250" y="275" text-anchor="middle" fill="#67e8f9" font-family="Inter,Arial" font-size="20" font-weight="800">elbow-up</text></g><g transform="translate(630 145)"><rect width="500" height="300" rx="25" fill="#071426" stroke="#a78bfa"/><path d="M85 235H430M85 235V45" stroke="#334155" stroke-width="2"/><circle cx="405" cy="105" r="15" fill="#fbbf24" filter="url(#glow)"/><g fill="none" stroke-linecap="round" stroke-width="15"><path d="M115 235L270 255L405 105" stroke="#c4b5fd"/></g><g fill="#fff"><circle cx="115" cy="235" r="12"/><circle cx="270" cy="255" r="12"/></g><text x="250" y="275" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial" font-size="20" font-weight="800">elbow-down</text></g></svg>