<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 670" role="img" aria-labelledby="t d"><title id="t">Branch-aware multi-start inverse kinematics for Alpha5</title><desc id="d">Seeds around the first Alpha5 joint and several posture templates feed local solvers, whose candidate solutions are ranked.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#11182d"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11z" fill="#67e8f9"/></marker></defs>
<rect width="1400" height="670" rx="42" fill="url(#bg)"/><text x="70" y="76" fill="#fff" font-family="Inter,Arial" font-size="38" font-weight="800">Branch-aware multi-start on Alpha5</text><text x="70" y="116" fill="#a8b5c8" font-family="Inter,Arial" font-size="21">Explore base-angle branches and posture templates, then rank complete IK candidates.</text>
<g transform="translate(85 170)"><rect width="390" height="400" rx="30" fill="#08182a" stroke="#22d3ee" stroke-width="2"/><text x="195" y="48" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="25" font-weight="800">1 · deterministic seeds</text><circle cx="195" cy="215" r="118" fill="none" stroke="#334155" stroke-width="24"/><g font-family="Inter,Arial" font-size="15" fill="#a8b5c8" text-anchor="middle"><text x="195" y="75">0°</text><text x="340" y="220">90°</text><text x="195" y="370">180°</text><text x="50" y="220">270°</text></g>
<g fill="#fbbf24"><circle cx="195" cy="97" r="10"/><circle cx="278" cy="132" r="10"/><circle cx="313" cy="215" r="10"/><circle cx="278" cy="298" r="10"/><circle cx="195" cy="333" r="10"/><circle cx="112" cy="298" r="10"/><circle cx="77" cy="215" r="10"/><circle cx="112" cy="132" r="10"/></g><circle cx="77" cy="215" r="20" fill="none" stroke="#fb7185" stroke-width="4"/><text x="195" y="392" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="16">q₁ = 0°, 45°, …, 315°</text></g>
<path d="M500 370H590" stroke="#67e8f9" stroke-width="4" marker-end="url(#arr)"/>
<g transform="translate(615 170)"><rect width="310" height="400" rx="30" fill="#17162a" stroke="#a78bfa" stroke-width="2"/><text x="155" y="48" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="25" font-weight="800">2 · local solve</text><g transform="translate(55 90)" fill="none" stroke-linecap="round" stroke-width="12"><path d="M15 210L70 155L125 185L200 75" stroke="#dbeafe"/><circle cx="15" cy="210" r="10" fill="#22d3ee" stroke="none"/><circle cx="70" cy="155" r="10" fill="#60a5fa" stroke="none"/><circle cx="125" cy="185" r="10" fill="#a78bfa" stroke="none"/><circle cx="200" cy="75" r="11" fill="#fbbf24" stroke="none"/></g><text x="155" y="337" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial" font-size="18">DLS / QP / least squares</text><text x="155" y="366" text-anchor="middle" fill="#a8b5c8" font-family="Inter,Arial" font-size="16">same solver, different basin</text></g>
<path d="M950 370H1040" stroke="#67e8f9" stroke-width="4" marker-end="url(#arr)"/>
<g transform="translate(1060 170)"><rect width="255" height="400" rx="30" fill="#0c241e" stroke="#34d399" stroke-width="2"/><text x="128" y="48" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="25" font-weight="800">3 · rank</text><g font-family="Inter,Arial"><rect x="25" y="88" width="205" height="58" rx="14" fill="#0b1724" stroke="#34d399"/><text x="42" y="113" fill="#6ee7b7" font-size="15" font-weight="800">candidate 7</text><text x="42" y="135" fill="#a8b5c8" font-size="14">residual 2.1 mm</text><rect x="25" y="160" width="205" height="58" rx="14" fill="#0b1724" stroke="#334155"/><text x="42" y="185" fill="#dbeafe" font-size="15" font-weight="800">candidate 3</text><text x="42" y="207" fill="#a8b5c8" font-size="14">residual 5.8 mm</text><rect x="25" y="232" width="205" height="58" rx="14" fill="#0b1724" stroke="#334155"/><text x="42" y="257" fill="#dbeafe" font-size="15" font-weight="800">candidate 12</text><text x="42" y="279" fill="#a8b5c8" font-size="14">residual 18.4 mm</text></g><text x="128" y="337" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="16">score = error + bias</text><text x="128" y="365" text-anchor="middle" fill="#a8b5c8" font-family="Inter,Arial" font-size="15">prefer feasible, nearby branches</text></g>
<g transform="translate(295 600)"><rect width="810" height="42" rx="21" fill="#111827" stroke="#334155"/><text x="405" y="27" text-anchor="middle" fill="#dbeafe" font-family="Inter,Arial" font-size="17">Use branch search for solve-once planning; avoid switching branches inside a one-step servo loop.</text></g>
</svg>