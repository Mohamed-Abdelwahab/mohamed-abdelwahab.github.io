<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="t d">
<title id="t">From Cartesian target to real Alpha5 motion</title><desc id="d">A pipeline showing a Cartesian target, inverse kinematics candidates, trajectory planning, Stonefish simulation, and the real Alpha5 robot.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0f1b33"/></linearGradient>
 <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
 <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#67e8f9"/></marker>
</defs>
<rect width="1400" height="620" rx="42" fill="url(#bg)"/>
<g opacity=".22" stroke="#7dd3fc"><path d="M0 90H1400M0 180H1400M0 270H1400M0 360H1400M0 450H1400M0 540H1400"/><path d="M100 0V620M250 0V620M400 0V620M550 0V620M700 0V620M850 0V620M1000 0V620M1150 0V620M1300 0V620"/></g>
<text x="70" y="78" fill="#fff" font-family="Inter,Arial" font-size="38" font-weight="800">A target is not a joint command</text>
<text x="70" y="120" fill="#a8b5c8" font-family="Inter,Arial" font-size="21">The complete chain converts a task-space intention into a safe, timed, position-controlled motion.</text>

<g transform="translate(70 185)">
 <rect width="220" height="260" rx="28" fill="#0c1b30" stroke="#22d3ee" stroke-width="2"/>
 <circle cx="110" cy="88" r="38" fill="#fbbf24" opacity=".22" stroke="#fbbf24" stroke-width="3"/>
 <circle cx="110" cy="88" r="12" fill="#fbbf24" filter="url(#glow)"/>
 <path d="M110 88h70M110 88v-58M110 88l-48 42" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
 <text x="110" y="170" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="24" font-weight="800">Cartesian target</text>
 <text x="110" y="202" text-anchor="middle" fill="#a8b5c8" font-family="Inter,Arial" font-size="17">position / pose</text>
 <text x="110" y="230" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="18">x<tspan baseline-shift="sub">g</tspan></text>
</g>

<path d="M310 315H390" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(410 185)">
 <rect width="270" height="260" rx="28" fill="#11162b" stroke="#a78bfa" stroke-width="2"/>
 <g transform="translate(35 38)" fill="none" stroke-linecap="round" stroke-width="9">
  <path d="M22 145L75 105L128 132L185 78" stroke="#dbeafe"/>
  <circle cx="22" cy="145" r="9" fill="#22d3ee" stroke="none"/><circle cx="75" cy="105" r="9" fill="#60a5fa" stroke="none"/><circle cx="128" cy="132" r="9" fill="#a78bfa" stroke="none"/><circle cx="185" cy="78" r="10" fill="#fbbf24" stroke="none"/>
  <path d="M25 155L72 70L135 55L190 105" stroke="#67e8f9" opacity=".34"/>
  <path d="M25 155L90 152L150 95L192 72" stroke="#fb7185" opacity=".34"/>
 </g>
 <text x="135" y="205" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="24" font-weight="800">IK candidates</text>
 <text x="135" y="235" text-anchor="middle" fill="#a8b5c8" font-family="Inter,Arial" font-size="17">multiple branches, one endpoint</text>
</g>

<path d="M700 315H780" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(800 185)">
 <rect width="250" height="260" rx="28" fill="#0d2028" stroke="#34d399" stroke-width="2"/>
 <path d="M35 140C75 30 160 225 215 80" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round"/>
 <g fill="#fbbf24"><circle cx="35" cy="140" r="10"/><circle cx="215" cy="80" r="10"/></g>
 <path d="M55 170H205" stroke="#a8b5c8" stroke-width="2" stroke-dasharray="8 8"/>
 <text x="125" y="205" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="24" font-weight="800">Trajectory</text>
 <text x="125" y="235" text-anchor="middle" fill="#a8b5c8" font-family="Inter,Arial" font-size="17">timing, speed, smoothness</text>
</g>

<path d="M1070 315H1145" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(1165 185)">
 <rect width="170" height="260" rx="28" fill="#19152a" stroke="#fb7185" stroke-width="2"/>
 <rect x="30" y="36" width="110" height="72" rx="10" fill="#0b1220" stroke="#60a5fa"/>
 <path d="M48 89l25-22 19 15 28-31" fill="none" stroke="#22d3ee" stroke-width="5"/>
 <path d="M56 148l30-35 31 18 15 44" fill="none" stroke="#dbeafe" stroke-width="10" stroke-linecap="round"/>
 <circle cx="56" cy="148" r="8" fill="#22d3ee"/><circle cx="86" cy="113" r="8" fill="#60a5fa"/><circle cx="117" cy="131" r="8" fill="#a78bfa"/><circle cx="132" cy="175" r="9" fill="#fbbf24"/>
 <text x="85" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="22" font-weight="800">Sim → real</text>
 <text x="85" y="239" text-anchor="middle" fill="#a8b5c8" font-family="Inter,Arial" font-size="16">Stonefish + Alpha5</text>
</g>
<g transform="translate(390 500)"><rect width="620" height="72" rx="22" fill="#071426" stroke="#334155"/><text x="310" y="30" text-anchor="middle" fill="#67e8f9" font-family="Inter,Arial" font-size="18" font-weight="800">IK answers “where can the joints end?”</text><text x="310" y="54" text-anchor="middle" fill="#a8b5c8" font-family="Inter,Arial" font-size="16">Planning answers “how should the robot move there?”</text></g>
</svg>