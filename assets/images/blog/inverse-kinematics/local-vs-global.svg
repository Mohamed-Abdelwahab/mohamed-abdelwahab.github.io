<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="t d"><title id="t">Local inverse kinematics and multi-start basin exploration</title><desc id="d">An error landscape shows a local solver trapped in one basin and multi-start initializations exploring several basins.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10192c"/></linearGradient><radialGradient id="well1"><stop stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><radialGradient id="well2"><stop stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker></defs>
<rect width="1400" height="650" rx="42" fill="url(#bg)"/><text x="70" y="75" fill="#fff" font-family="Inter,Arial" font-size="38" font-weight="800">Reachable does not mean locally reachable</text><text x="70" y="116" fill="#a8b5c8" font-family="Inter,Arial" font-size="21">A Jacobian step sees the slope around the current configuration—not every distant kinematic branch.</text>
<g transform="translate(70 165)"><rect width="1260" height="400" rx="30" fill="#071426" stroke="#334155"/>
<ellipse cx="320" cy="250" rx="260" ry="135" fill="url(#well1)"/><ellipse cx="930" cy="225" rx="270" ry="150" fill="url(#well2)"/>
<g fill="none" stroke-width="2" opacity=".55"><ellipse cx="320" cy="250" rx="210" ry="110" stroke="#22d3ee"/><ellipse cx="320" cy="250" rx="150" ry="76" stroke="#22d3ee"/><ellipse cx="320" cy="250" rx="85" ry="42" stroke="#22d3ee"/><ellipse cx="930" cy="225" rx="220" ry="120" stroke="#a78bfa"/><ellipse cx="930" cy="225" rx="155" ry="80" stroke="#a78bfa"/><ellipse cx="930" cy="225" rx="88" ry="43" stroke="#a78bfa"/></g>
<circle cx="320" cy="250" r="13" fill="#22d3ee"/><text x="320" y="295" text-anchor="middle" fill="#67e8f9" font-family="Inter,Arial" font-size="18" font-weight="800">local stationary point</text>
<circle cx="930" cy="225" r="13" fill="#34d399"/><text x="930" y="270" text-anchor="middle" fill="#6ee7b7" font-family="Inter,Arial" font-size="18" font-weight="800">lower-residual branch</text>
<circle cx="135" cy="95" r="12" fill="#fb7185"/><text x="135" y="67" text-anchor="middle" fill="#fda4af" font-family="Inter,Arial" font-size="17" font-weight="800">single seed</text><path d="M145 105C210 128 250 170 300 226" fill="none" stroke="#fbbf24" stroke-width="5" marker-end="url(#arr)"/>
<g fill="#fff"><circle cx="655" cy="82" r="9"/><circle cx="760" cy="120" r="9"/><circle cx="1110" cy="98" r="9"/><circle cx="1175" cy="210" r="9"/><circle cx="780" cy="340" r="9"/><circle cx="1040" cy="355" r="9"/></g>
<g fill="none" stroke="#67e8f9" stroke-width="3" opacity=".85"><path d="M655 82C740 120 830 160 900 210"/><path d="M760 120C820 145 870 175 915 211"/><path d="M1110 98C1040 130 990 170 945 215"/><path d="M1175 210C1080 210 1015 215 945 223"/><path d="M780 340C825 310 870 270 918 235"/><path d="M1040 355C995 315 960 275 938 240"/></g>
<text x="930" y="50" text-anchor="middle" fill="#fff" font-family="Inter,Arial" font-size="21" font-weight="800">multi-start: several seeds, same local solver</text>
</g>
<g transform="translate(410 585)"><rect width="580" height="42" rx="21" fill="#111827" stroke="#fbbf24" stroke-opacity=".45"/><text x="290" y="27" text-anchor="middle" fill="#fde68a" font-family="Inter,Arial" font-size="17">Broader initialization improves coverage; it is not a proof of global optimality.</text></g>
</svg>